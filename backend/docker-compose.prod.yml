# Production stack for the VPS: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# (the deploy workflow builds and migrates first, so the old API keeps serving until the new one is ready).
# HTTPS comes from the Caddy already running on the VPS; add deploy/Caddyfile's block to its Caddyfile.
name: resumebuilder

services:
  # Named shortlist-api, not api: Compose adds the service name as an alias on every network, and on the
  # shared caddy-edge network a generic "api" would collide with other apps' services.
  shortlist-api:
    build: { context: ., target: api }
    restart: unless-stopped
    env_file: .env.production
    # server.ts drains open requests on SIGTERM; AI calls can take ~2.5 min, so give deploys time before SIGKILL.
    stop_grace_period: 3m
    # Docker keeps logs until the container is replaced; cap them so a busy day can't fill the disk.
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@shortlist-postgres:5432/resumebuilder
      COMPILER_URL: http://compiler:4100
    networks:
      edge: {}
      backend: {}
      compile: {}
      # Shared with the one Caddy on the VPS that serves ports 80/443 for every app.
      caddy-edge: {}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    depends_on:
      postgres: { condition: service_healthy }
      compiler: { condition: service_healthy }

  worker:
    build: { context: ., target: api }
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@shortlist-postgres:5432/resumebuilder
      COMPILER_URL: http://compiler:4100
    # edge gives outbound internet access (R2, AI providers); backend reaches Postgres.
    networks: [edge, backend]
    # Waits for the API, which migrates on start, so the worker never runs new code against the old schema.
    depends_on:
      shortlist-api: { condition: service_healthy }

  # Untrusted LaTeX runs here: no secrets, no internet (internal network only), read-only filesystem, capped resources.
  compiler:
    build: { context: ., target: compiler }
    restart: unless-stopped
    environment:
      COMPILE_TIMEOUT_MS: "20000"
      # Three at once on the 4-core VPS, still capped below so a burst can't starve the API, Postgres or the other app.
      COMPILE_CONCURRENCY: "3"
    read_only: true
    tmpfs:
      - /tmp:size=384m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    cpus: 2.5
    pids_limit: 128
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4100/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [compile]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: resumebuilder
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resumebuilder"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      # Only on the private network; the alias keeps DATABASE_URL independent of the service name.
      backend:
        aliases: [shortlist-postgres]

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
    networks: [edge, backend]
    depends_on:
      postgres: { condition: service_healthy }

networks:
  # The reverse proxy's doorway network, created once on the VPS: docker network create caddy-edge.
  # Only the API joins it; databases stay on shortlist-backend.
  caddy-edge:
    external: true
    name: caddy-edge
  edge: {}
  backend: { internal: true, name: shortlist-backend }
  compile: { internal: true }

volumes:
  postgres-data:
